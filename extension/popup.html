<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .count { font-size: 22px; font-weight: 600; color: #d33; }
    .status { font-size: 12px; }
    .ok { color: #188038; } .ng { color: #d33; }
    input[type=range] { width: 130px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Jev Ad Filter</h1>
  <div class="row"><span>このページで非表示</span><span class="count" id="count">0</span></div>
  <div class="row"><label for="enabled">有効</label><input type="checkbox" id="enabled"></div>
  <div class="row"><label for="site">このサイトで無効</label><input type="checkbox" id="site"></div>
  <div class="row">
    <label for="threshold">しきい値 <span id="thv"></span></label>
    <input type="range" id="threshold" min="0.5" max="0.99" step="0.01">
  </div>
  <small>高いほど慎重（誤って本文を消しにくい）</small>
  <div class="row"><span>サーバー</span><span class="status" id="status">確認中…</span></div>
  <script src="popup.js"></script>
</body>
</html>
